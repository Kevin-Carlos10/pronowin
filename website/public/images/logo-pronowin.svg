<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="PronoWin">
  <title>PronoWin</title>

  <!--
    Logo PronoWin.

    Il reprend la marque qui existe déjà — le trophée blanc portant un « P »,
    sur fond orange — plutôt que d'en proposer une autre : c'est l'icône de
    l'application Android aujourd'hui, et la pastille « P » du site en est
    dérivée. Un logo qui ne ressemble pas au produit force à réapprendre la
    marque à chaque support.

    Les deux palettes divergeaient : le mobile utilise #E8541A / #F5A623,
    le site #F2632A / #D9451F. Le dégradé ci-dessous les traverse, de l'or
    du mobile au rouge profond du site.

    Aucune police n'est utilisée : le « P » est un tracé. Un rendu qui
    dépend d'une police installée produit un logo différent sur chaque
    machine — et se dégrade en silence.
  -->

  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#F5A623"/>
      <stop offset="0.45" stop-color="#E8541A"/>
      <stop offset="1"    stop-color="#D9451F"/>
    </linearGradient>

    <!-- Ombre portée très douce sous le trophée : elle décolle le blanc du
         fond orange sans être perceptible comme un effet. -->
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10"
                    flood-color="#7A2410" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#fond)"/>

  <!--
    Remontée de 13 px : le trophée s'étend de y=150 à y=388, son centre optique
    tombait donc sous le centre du carré. Invisible sur un carré, net dès que
    Telegram recadre en cercle.
  -->
  <g filter="url(#ombre)" transform="translate(0,-13)">
    <!-- Anses : tracées en trait épais à bouts ronds, comme sur l'icône. -->
    <g fill="none" stroke="#FFFFFF" stroke-width="22"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M176 180 C 126 180, 112 216, 132 244 C 142 258, 156 264, 176 266"/>
      <path d="M336 180 C 386 180, 400 216, 380 244 C 370 258, 356 264, 336 266"/>
    </g>

    <!-- Coupe, pied et socle -->
    <path fill="#FFFFFF" d="
      M176 150 H336 V232 A80 80 0 0 1 176 232 Z
      M240 306 H272 V350 H240 Z
      M192 350 H320 A10 10 0 0 1 330 360 V378 A10 10 0 0 1 320 388
      H192 A10 10 0 0 1 182 378 V360 A10 10 0 0 1 192 350 Z"/>

    <!-- « P » évidé dans la coupe. Deux sous-tracés + evenodd : le second
         perce le contre-poinçon.

         Agrandi de 14 % autour de son centre — le tracé natif est centré en
         (263,232), on le ramène à l'origine, on l'échelonne, puis on le pose
         en (256,225), centre optique de la coupe. À 40 px, taille du logo
         dans une liste de discussions, le contre-poinçon se refermait. -->
    <path fill="#E8541A" fill-rule="evenodd" transform="translate(256,225) scale(1.14) translate(-263,-232)" d="
      M228 184 H266 A32 32 0 0 1 266 248 H250 V280 H228 Z
      M250 202 H266 A14 14 0 0 1 266 230 H250 Z"/>
  </g>
</svg>
